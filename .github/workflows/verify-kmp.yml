name: Verify Kotlin Multiplatform app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-tests-and-android-debug-build:
    name: Shared tests and Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run shared Kotlin tests
        run: ./gradlew :shared:desktopTestTest --no-daemon

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Keep debug APK for review
        uses: actions/upload-artifact@v4
        with:
          name: little-english-android-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 14
