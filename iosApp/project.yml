name: LittleEnglish
options:
  bundleIdPrefix: com.ahochma
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_BUNDLE_IDENTIFIER: com.ahochma.littleenglish
    DEVELOPMENT_TEAM: ""
targets:
  LittleEnglish:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
